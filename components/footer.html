<footer class="footer results-footer results-theme-{{theme}}">
  <div class="wrap results-footer__main">
    <div class="results-footer__identity">
      <a class="logo results-footer__logo" href="/" aria-label="{{business}} home"><img class="brand-symbol" src="/assets/brand/results-symbol.png" alt="" width="44" height="40"><span class="brand">RESULTS<br>{{brand_suffix}}<small>PART OF RESULTS FIRST AID</small></span></a>
      <div class="footer-contact results-footer__contact">
        <a class="footer-phone" href="{{phone_href}}">{{phone_display}}</a>
        <a class="footer-email" href="mailto:{{email}}">{{email}}</a>
        <small>{{description}}</small>
      </div>
      <a class="results-footer__cta" href="{{cta_href}}">{{cta_label}} <span aria-hidden="true">↗</span></a>
    </div>
    <nav class="results-footer__explore" aria-label="Explore Results websites">
      <h2>Explore Results</h2>
      <ul>
        <li>{{public_link}}</li>
        <li>{{workplace_link}}</li>
        <li>{{services_link}}</li>
        <li><span class="results-footer__pending">About Results <span class="results-footer__hint">Coming soon</span></span></li>
      </ul>
    </nav>
  </div>
  <div class="wrap results-footer__bottom">
    <small>© {{year}} {{business}}</small>
    <div class="results-footer__legal"><a href="{{privacy_path}}">Privacy</a><a href="{{contact_path}}">Contact</a><a href="#top">Back to top ↑</a></div>
  </div>
</footer>
