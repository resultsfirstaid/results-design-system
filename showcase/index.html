<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results Design System · Component Showcase v0.6</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../tokens/foundations.css"><link rel="stylesheet" href="../components/library.css"><link rel="stylesheet" href="../components/buttons.css"><link rel="stylesheet" href="../components/adoption.css"><link rel="stylesheet" href="../components/adoption-v06.css"><style>body{margin:0;font-family:'DM Sans',sans-serif;color:#203338;background:#f5f8f8}.top{padding:45px max(24px,calc((100vw - 1100px)/2));background:#fff}.top h1{font:800 clamp(30px,5vw,48px) Manrope;margin:0 0 12px}.top p{line-height:1.6;max-width:720px}.shell{max-width:1100px;margin:0 auto;padding:24px}.theme{margin:25px 0 45px;background:white;border-radius:24px;padding:clamp(20px,4vw,42px);box-shadow:0 6px 30px #0001}.theme h2{font:800 27px Manrope;margin:0 0 22px}.sample{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.sample article{padding:20px;border:1px solid #e5ecee;border-radius:18px}.sample h3{font:800 19px Manrope;margin:0 0 10px}.sample p{font-size:14px;line-height:1.6}.swatches{display:flex;gap:10px;margin-bottom:20px}.swatch{height:44px;flex:1;border-radius:12px}.component-title{font:800 17px Manrope;margin:30px 0 14px}.r-field{margin-top:14px}.r-btn{margin-right:8px;margin-bottom:8px}.sample .r-product{box-shadow:none;border:1px solid #e5ecee}.demo-image{height:130px;background:var(--r-tint);display:grid;place-items:center;font-size:40px}.r-product__body h3{margin:0 0 12px}.r-accordion summary{padding:12px 0}.fullbleed{background:var(--r-primary);color:white;padding:32px;border-radius:24px;margin-top:25px}.fullbleed.results-edge-flush{border-radius:0}footer{padding:25px;text-align:center;color:#65706b;font-size:12px}@media(max-width:650px){.shell{padding:12px}.theme{border-radius:16px}.top{padding:30px 22px}}</style></head><body><header class="top"><h1>Results UI Library</h1><p>v0.6.0 · Shared structure, distinct business colours. A working reference for headings, buttons, fields, cards, product UI, FAQs and edge-aware panels. Examples use placeholder content and do not submit data.</p></header><main class="shell"><div id="themes"></div></main><footer>Design showcase only · No production forms or checkout logic</footer><script>const specs=[{name:'Workplace Training',cls:'results-theme-workplace',primary:'#23394b',accent:'#7d3c55',tint:'#f7f3f5'},{name:'First Aid Services',cls:'results-theme-services',primary:'#176f70',accent:'#103335',tint:'#f0faf6'},{name:'Results Training — proposed',cls:'',primary:'#334b5a',accent:'#a36c57',tint:'#f6f2ed'},{name:'Public First Aid — proposed',cls:'',primary:'#315e75',accent:'#407d9b',tint:'#f4f9fb'}];const root=document.getElementById('themes');for(const s of specs){const section=document.createElement('section');section.className='theme '+s.cls;section.style.setProperty('--r-primary',s.primary);section.style.setProperty('--r-accent',s.accent);section.style.setProperty('--r-tint',s.tint);section.innerHTML=`<h2>${s.name}</h2><div class="swatches"><div class="swatch" style="background:${s.primary}"></div><div class="swatch" style="background:${s.accent}"></div><div class="swatch" style="background:${s.tint}"></div></div><div class="component-title">Typography & actions</div><h3 class="r-type-h3">Clear, consistent headings</h3><p class="r-type-body">The same component geometry, spacing and font system across the family.</p><a class="r-btn" href="#themes">Primary action →</a><a class="r-btn r-btn--outline" href="#themes">Secondary action</a><div class="component-title">Cards & products</div><div class="sample"><article class="r-course-card"><div class="r-course-card__media demo-image" style="color:${s.primary}">✚</div><div class="r-course-card__body"><span class="r-course-card__eyebrow">TRAINING</span><h3 class="r-course-card__title">Provide First Aid</h3><p class="r-course-card__description">A reusable course card for course lists and cross-site referrals.</p><a class="r-course-card__action" href="#themes">Explore course ↗</a></div></article><div class="r-product"><div class="r-product__image demo-image" style="color:${s.primary}">▣</div><div class="r-product__body"><h3>Workplace first aid kit</h3><p class="r-price">Price on request</p><a href="#themes" class="r-btn">View product →</a></div></div></div><div class="component-title">Form controls</div><div class="r-form-grid"><div class="r-field"><label class="r-label" for="email-${s.name.replace(/[^a-z]/gi,'')}">Email address</label><input class="r-input" id="email-${s.name.replace(/[^a-z]/gi,'')}" type="email" placeholder="name@example.com"></div><div class="r-field"><label class="r-label">Enquiry type</label><select class="r-select"><option>Training enquiry</option><option>Equipment and servicing</option></select></div></div><div class="component-title">Disclosure & messaging</div><details class="r-accordion"><summary>What's included?</summary><div class="r-accordion__body">The shared library supplies visual components; each website controls its own content and data.</div></details><div class="r-alert" role="status" style="margin-top:16px">Example status message</div><div class="fullbleed" data-results-edge-panel><strong>Edge-aware panel</strong><p>Rounded corners disappear only if this panel actually meets the viewport edge.</p></div>`;root.appendChild(section)}</script><script defer src="../interactions/edge-panels.js"></script></body></html>
